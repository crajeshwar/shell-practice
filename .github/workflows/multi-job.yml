name: Working with multipule jobs

on: push 

jobs:
    first_job_1:
        runs-on: ubuntu-latest
        steps:
        - name: Install Cowsay program
          run: sudo apt-get install cowsay -y

        - name: Execute cowsay CMD
          run: cowsay -f dragon "run for cover, I am a DRAGON.....RAWR " >> dragon.txt

        - name: Upload Dragon to the text file
          uses: actions/upload-artifact@v4
          with:
            name: dragon-text
            path: dragon.txt

    test_job_2:
        needs: first_job_1
        runs-on: ubuntu-latest
        steps:
        - name: Download Dragon to the text file
          uses: actions/download-artifact@v4
          with:
            name: dragon-text
          
        - name: Test file Exits
          run: grep -i "dragon" dragon.txt

    deploy_job_2:
        needs: test_job_2
        runs-on: ubuntu-latest
        steps:
        - name: Download Dragon to the text file
          uses: actions/upload-artifact@v3
          with:
            name: dragon-text
        - name: Read File
          run: cat dragon.txt
          
        - name: Deploy
          run: echo Deploying...... ..... ... .. .